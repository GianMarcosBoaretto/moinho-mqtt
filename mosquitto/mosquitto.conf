# Mosquitto do prototipo (bancada).
listener 1883

# Seguranca: sem conexao anonima. O arquivo de senhas (hashes) e gerado na subida do
# container a partir das variaveis do .env (ver docker-compose.yml); nao fica no Git.
allow_anonymous false
password_file /mosquitto/data/senhas
# cada usuario so publica/assina os topicos dele
acl_file /mosquitto/config/acl

# Persistencia: sessoes persistentes (clean_session=false), mensagens QoS 1
# pendentes e mensagens retained sobrevivem a reinicio do broker.
persistence true
persistence_location /mosquitto/data/
autosave_interval 10

# Fila por cliente com sessao persistente desconectado (ex.: backend fora do ar).
max_queued_messages 5000

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp_format %Y-%m-%dT%H:%M:%S
